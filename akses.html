<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BADAI PROMPT UMKM — Akses</title>
<style>:root{--bg:#070707;--card:#111;--line:#272727;--pink:#ff2d8d;--text:#fff;--muted:#999}*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;background:radial-gradient(circle at 80% 0,rgba(255,45,141,.22),transparent 28%),var(--bg);padding-bottom:80px}header{position:sticky;top:0;z-index:10;padding:14px 18px;background:rgba(7,7,7,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.brand{font-weight:1000}.brand b{color:var(--pink)}main{padding:18px}.hero,.card{background:#101010;border:1px solid var(--line);border-radius:20px}.hero{padding:18px}.hero h1{margin:6px 0;font-size:30px}.hero p{color:#aaa}.search{width:100%;margin-top:12px;background:#090909;border:1px solid #333;border-radius:14px;padding:14px;color:#fff}.sec{margin-top:24px}.sec h2{font-size:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.biz,.goal{background:#111;border:1px solid var(--line);color:#fff;border-radius:15px;padding:13px;text-align:left;cursor:pointer}.biz.on,.goal.on{border-color:var(--pink);background:#1a1016}.goals{display:flex;gap:8px;overflow:auto}.goal{min-width:145px}.cards{display:grid;gap:10px}.card{padding:15px}.meta{font-size:10px;color:#999}.card h3{margin:8px 0}.card p{font-size:11px;line-height:1.5;color:#999}.btns{display:flex;gap:8px;margin-top:12px}.btn{border:0;border-radius:12px;padding:11px 12px;font-weight:900;cursor:pointer}.pink{background:var(--pink);color:#fff;flex:1}.dark{background:#222;color:#fff}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,720px);background:rgba(8,8,8,.95);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:10px}.nav div{text-align:center;font-size:10px;color:#aaa}.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:flex-end;justify-content:center;z-index:30}.modal.show{display:flex}.sheet{width:min(100%,720px);max-height:90vh;overflow:auto;background:#101010;border-radius:24px 24px 0 0;padding:18px}.sheet input,.sheet textarea{width:100%;background:#090909;color:#fff;border:1px solid #333;border-radius:12px;padding:12px;margin:6px 0}.out{white-space:pre-wrap;background:#090909;border:1px solid #292929;border-radius:14px;padding:12px;font:12px/1.5 monospace}@media(min-width:600px){.grid{grid-template-columns:repeat(5,1fr)}}</style></head>
<body><div class="app"><header><div class="brand">BADAI <b>PROMPT UMKM</b></div><a href="/" style="color:#fff;text-decoration:none">LP</a></header><main><section class="hero"><small style="color:#ff6fb3;font-weight:900">PROMPT ENGINE UNTUK UMKM</small><h1>Mau jualan apa hari ini?</h1><p>Pilih bisnis dan kebutuhan. Prompt yang relevan langsung muncul.</p><input class="search" id="q" placeholder="Cari: sepi order, video, kuliner..."></section><section class="sec"><h2>1. Kamu jualan apa?</h2><div class="grid" id="biz"></div></section><section class="sec"><h2>2. Lagi butuh apa?</h2><div class="goals" id="goals"></div></section><section class="sec"><h2>3. Prompt yang cocok</h2><div class="cards" id="cards"></div></section></main></div><div class="nav"><div>⌂<br>Beranda</div><div>⌕<br>Prompt</div><div>★<br>Favorit</div><div>☻<br>Akun</div></div>
<div class="modal" id="modal"><div class="sheet"><button class="btn dark" onclick="modal.classList.remove('show')" style="float:right">×</button><h2 id="title">Prompt</h2><input id="name" placeholder="Nama bisnis"><input id="product" placeholder="Produk / layanan"><input id="price" placeholder="Harga"><input id="city" placeholder="Kota / area"><textarea id="edge" placeholder="Keunggulan nyata"></textarea><button class="btn pink" onclick="build()">BUAT PROMPT</button><pre class="out" id="out"></pre><button class="btn dark" onclick="navigator.clipboard.writeText(out.textContent)">SALIN</button></div></div>
<script>
const B=[['kuliner','🍜','Kuliner'],['fashion','👗','Fashion'],['beauty','💄','Beauty'],['jasa','🛠️','Jasa'],['edukasi','🎓','Pendidikan'],['properti','🏠','Properti'],['otomotif','🏍️','Otomotif'],['hampers','🎁','Hampers'],['retail','🛒','Retail'],['event','🎉','Event']];
const G=[['promo','Promo Hari Ini'],['sepi','Sepi Order'],['foto','Foto Produk'],['video','Video Jualan'],['caption','Caption'],['wa','Broadcast WA'],['follow','Follow-up']];
const P=[
['kuliner','sepi','Sepi Order Tanpa Banting Harga','Bertindak sebagai growth marketer UMKM Indonesia. Bisnis [NAMA BISNIS] di [KOTA]. Produk [PRODUK], harga [HARGA]. Keunggulan: [KEUNGGULAN]. Buat 5 ide aktivasi penjualan hari ini tanpa diskon palsu.'],
['kuliner','foto','Foto Produk Kuliner yang Menggoda','Bertindak sebagai art director. Buat 3 prompt foto produk realistis untuk [PRODUK] dari [NAMA BISNIS] di [KOTA], harga [HARGA]. Tonjolkan [KEUNGGULAN].'],
['fashion','promo','Promo Fashion Tanpa Teriak Diskon','Bertindak sebagai copywriter fashion. Buat 3 angle promo untuk [PRODUK] dari [NAMA BISNIS], harga [HARGA], di [KOTA]. Keunggulan: [KEUNGGULAN].'],
['beauty','follow','Follow-up Booking Beauty','Bertindak sebagai admin beauty service. Buat 5 pesan follow-up ramah untuk [PRODUK] di [NAMA BISNIS], [KOTA], harga [HARGA].'],
['jasa','caption','Caption Jasa Lokal yang Nggak Kaku','Buat 3 caption penjualan natural untuk jasa [PRODUK] dari [NAMA BISNIS] di [KOTA], harga [HARGA]. Keunggulan: [KEUNGGULAN].'],
['properti','video','Video Listing Properti 20 Detik','Buat 3 konsep video vertikal 20 detik untuk [PRODUK] dari [NAMA BISNIS] di [KOTA], harga [HARGA].'],
['otomotif','wa','Broadcast Servis yang Nggak Spam','Buat 5 pesan WhatsApp untuk [PRODUK] dari [NAMA BISNIS] di [KOTA], harga [HARGA]. Hindari spam dan urgency palsu.'],
['event','caption','Caption Event yang Jual Ketenangan','Buat 3 caption event untuk [PRODUK] dari [NAMA BISNIS] di [KOTA]. Fokus pada ketenangan klien dan [KEUNGGULAN].']
];
let sb='',sg='',cur=null;biz.innerHTML=B.map(x=>'<button class="biz" onclick="sb=sb===\''+x[0]+'\'?\'\':\''+x[0]+'\';render()">'+x[1]+'<br><b>'+x[2]+'</b></button>').join('');goals.innerHTML=G.map(x=>'<button class="goal" onclick="sg=sg===\''+x[0]+'\'?\'\':\''+x[0]+'\';render()">'+x[1]+'</button>').join('');
function render(){[...document.querySelectorAll('.biz')].forEach((e,i)=>e.classList.toggle('on',B[i][0]===sb));[...document.querySelectorAll('.goal')].forEach((e,i)=>e.classList.toggle('on',G[i][0]===sg));let s=q.value.toLowerCase(),a=P.filter(x=>(!sb||x[0]===sb)&&(!sg||x[1]===sg)&&(!s||(x[2]+' '+x[3]).toLowerCase().includes(s)));cards.innerHTML=a.length?a.map((x,i)=>'<article class="card"><div class="meta">'+x[0]+' • '+x[1]+'</div><h3>'+x[2]+'</h3><p>'+x[3]+'</p><div class="btns"><button class="btn pink" onclick="openP(\''+x[2].replace(/'/g,"")+'\')">PAKAI</button><button class="btn dark" onclick="navigator.clipboard.writeText(\''+x[3].replace(/'/g,"")+'\')">SALIN</button></div></article>').join(''):'<p style="color:#888">Belum ada prompt yang cocok. Coba filter lain.</p>'}
function openP(t){cur=P.find(x=>x[2].replace(/'/g,"")===t);title.textContent=cur[2];out.textContent=cur[3];modal.classList.add('show')}function build(){let s=cur[3].replaceAll('[NAMA BISNIS]',name.value||'[NAMA BISNIS]').replaceAll('[PRODUK]',product.value||'[PRODUK]').replaceAll('[HARGA]',price.value||'[HARGA]').replaceAll('[KOTA]',city.value||'[KOTA]').replaceAll('[KEUNGGULAN]',edge.value||'[KEUNGGULAN]');out.textContent=s}q.oninput=render;render();
</script></body></html>
