name: Telegram checks
on:
  pull_request:
    paths: ['api/telegram/**', 'functions/**', 'assets/telegram-*', 'admin.html', 'member.html', 'tests/telegram*', 'tests/fixtures/telegram*', 'scripts/verify-telegram*', 'scripts/verify-safe-release.cjs', 'package*.json', '.github/workflows/telegram-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:telegram-website
      - run: node --check scripts/verify-safe-release.cjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:telegram-ui
        env:
          CHROMIUM_PATH: playwright
