name: Marketing preview checks
on:
  pull_request:
    paths:
      - 'api/public-previews.js'
      - 'lib/marketing-public-handler.js'
      - 'lib/marketing-public.js'
      - 'prompt-free.html'
      - 'assets/prompt-free.*'
      - 'vercel.json'
      - 'tests/marketing-public.test.cjs'
      - 'tests/marketing-public-handler.test.cjs'
      - 'tests/repliz-dry-run.test.cjs'
      - 'tests/prompt-free-ui.test.cjs'
      - 'scripts/repliz-dry-run.cjs'
      - 'data/repliz-master-30.json'
      - '.github/workflows/marketing-preview-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check lib/marketing-public.js
      - run: node --check lib/marketing-public-handler.js
      - run: node --check api/public-previews.js
      - run: node --check assets/prompt-free.js
      - run: node --test tests/marketing-public.test.cjs tests/marketing-public-handler.test.cjs tests/repliz-dry-run.test.cjs tests/prompt-free-ui.test.cjs
      - run: node scripts/repliz-dry-run.cjs --days=3 --brand=demo-rose > /tmp/repliz-dry-run.json
      - run: node -e "const p=require('/tmp/repliz-dry-run.json'); if(p.count!==3 || !p.matched || !p.noNetworkOperations || p.entries.some(x=>x.canPublish)) process.exit(1);"
      - run: node -e "const c=require('./vercel.json'); if(!c.rewrites.some(x=>x.source==='/c/:client/p/:bp'&&x.destination==='/prompt-free.html')) process.exit(1);"
