name: Freemium landing smoke
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/landing-freemium.css'
      - 'tests/landing-freemium-smoke.test.cjs'
      - '.github/workflows/landing-freemium.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/landing-freemium-smoke.test.cjs
